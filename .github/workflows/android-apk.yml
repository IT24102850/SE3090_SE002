name: Build Android APK

on:
  push:
    paths:
      - "mobile/sme_mobile/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "mobile/sme_mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mobile/sme_mobile/pubspec.lock

      - name: Install Flutter dependencies
        working-directory: mobile/sme_mobile
        run: flutter pub get

      # The URL is compiled into the binary, so it has to be passed here.
      # Without it the build falls back to ApiService._defaultBaseUrl(), which
      # is http://10.0.2.2:5000/api on Android - the emulator's alias for the
      # host machine, and meaningless on a real phone. An APK published from
      # this workflow is meant to be installed on real devices, so it gets the
      # deployed HTTPS API. Override by setting the API_BASE_URL repository
      # variable (Settings -> Secrets and variables -> Actions -> Variables).
      - name: Build release APK
        working-directory: mobile/sme_mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://sme-backend-lxsp.onrender.com/api' }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Show which API the APK points at
        working-directory: mobile/sme_mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://sme-backend-lxsp.onrender.com/api' }}
        run: |
          echo "APK built against $API_BASE_URL"
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::warning::APK points at a non-HTTPS URL; it will only work where cleartext is permitted." ;;
          esac

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sme-mobile-android-apk
          path: mobile/sme_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
