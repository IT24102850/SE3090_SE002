name: Security scan (OWASP ZAP)
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  zap-web:
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://se-3090-se-002.vercel.app
  zap-api:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s https://sme-backend-lxsp.onrender.com/health || true
      - uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: https://sme-backend-lxsp.onrender.com/swagger/v1/swagger.json
          format: openapi
