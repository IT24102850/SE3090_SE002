# Render Blueprint - deploys the ASP.NET Core backend from this repo.
# Postgres is already hosted on Supabase (see backend user-secrets), so no
# Render-managed database is declared here.
#
# One-time manual step (Render's CLI can't create new services, only manage
# existing ones): Render Dashboard -> New + -> Blueprint -> connect this
# repo -> it detects this file -> fill in the `sync: false` secrets below ->
# Deploy.
services:
  - type: web
    name: sme-backend
    runtime: docker
    rootDir: backend/SmeBackend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: SmeBackend
      - key: Jwt__Audience
        value: SmeBackendUsers
      - key: AgentService__BaseUrl
        value: https://sme-agentic-ai.onrender.com
      - key: AgentService__InternalToken
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      # Unify's own subscription billing - what tenants pay US for the
      # platform. These are the platform's merchant credentials and are
      # deliberately separate from anything a tenant configures for charging
      # their own customers. With the Stripe key unset the API falls back to
      # its sandbox provider: the whole flow still runs and says plainly that
      # it was simulated.
      - key: Platform__Billing__Currency
        value: LKR
      - key: Platform__Billing__TestMode
        value: "true"
      # Stripe will not accept LKR, so an LKR invoice settles on its own
      # amount while the card is charged the equivalent at this rate.
      - key: Platform__Billing__SettlementCurrency
        value: USD
      - key: Platform__Billing__Rates__LKR
        value: "300"
      - key: Platform__Billing__Stripe__SecretKey
        sync: false
      - key: Platform__Billing__Stripe__PublicKey
        sync: false
      # Only this deployment can receive webhooks - it has a public URL,
      # which a laptop does not. Point Stripe at
      # https://<this-service>/api/subscription/webhooks/stripe
      - key: Platform__Billing__Stripe__WebhookSecret
        sync: false
  - type: web
    name: sme-agentic-ai
    runtime: docker
    rootDir: agentic-ai-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_SERVICE_INTERNAL_TOKEN
        sync: false
      - key: BACKEND_API_BASE_URL
        value: https://sme-backend-lxsp.onrender.com/api
