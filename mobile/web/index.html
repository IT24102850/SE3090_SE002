<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stockwise inventory operations for SMEs.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stockwise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stockwise | Inventory operations</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #F5F7FA; font-family: Arial, sans-serif; }
    #stockwise-startup { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #102A43; }
    .startup-card { width: min(420px, 100%); box-sizing: border-box; padding: 28px; background: #fff; border: 1px solid #E5EAF0; border-radius: 22px; box-shadow: 0 18px 45px rgba(16, 42, 67, .10); }
    .startup-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 1px; }
    .startup-mark { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 14px; color: #fff; background: #12355B; font-size: 22px; }
    .startup-card p { margin: 22px 0 0; color: #60758A; line-height: 1.5; }
    .startup-card button { margin-top: 20px; padding: 11px 16px; border: 0; border-radius: 10px; color: #fff; background: #0C8B7C; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div id="stockwise-startup" role="status">
    <div class="startup-card">
      <div class="startup-brand"><span class="startup-mark">&#9638;</span><span>STOCKWISE</span></div>
      <p>Starting your inventory workspace&hellip;</p>
      <button type="button" onclick="window.location.reload()">Reload app</button>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    const startup = document.getElementById('stockwise-startup');
    new MutationObserver(() => {
      if (document.querySelector('flutter-view canvas, flutter-view flt-scene, flt-glass-pane canvas, flt-glass-pane flt-scene')) startup.remove();
    }).observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async onerror="document.querySelector('#stockwise-startup p').textContent = 'The app engine could not start. Reload the app after Flutter finishes building.'"></script>
</body>
</html>
