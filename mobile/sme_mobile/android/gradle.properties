org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The APK workflow tracks the stable Flutter channel, which now ships AGP 9.
# Under AGP 9 only the new Gradle DSL is read, and applying the Flutter Gradle
# plugin from app/build.gradle.kts then fails outright. These are the two flags
# Flutter's own migrator writes to keep the old DSL until the plugin block here
# is rewritten for the new one - the same opt-out the build error points to.
android.builtInKotlin=false
android.newDsl=false
